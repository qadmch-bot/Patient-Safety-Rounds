async function decideObservation(id, decision){
  const notesEl = document.getElementById('qa-notes');
  const notes = notesEl ? notesEl.value.trim() : '';
  if((decision==='reject'||decision==='clarify') && !notes){ toast(STATE.lang==='ar'?'السبب مطلوب':'A reason is required'); return; }
  const payload = { decision, qps_reviewer: currentActorName(), notes };
  if(decision==='approve'){
    payload.risk_level = document.getElementById('qa-risk').value;
    payload.responsible_department = document.getElementById('qa-dept').value;
    payload.responsible_person = document.getElementById('qa-person').value;
    payload.responsible_member_id = document.getElementById('qa-member').value || null;
    payload.corrective_required = document.getElementById('qa-corrective').checked;
    payload.due_date = document.getElementById('qa-due-date').value;
    if(payload.corrective_required && (!payload.due_date || payload.due_date < todayStr())){ toast(STATE.lang==='ar'?'حددي موعدًا نهائيًا صالحًا للخطة قبل الاعتماد':'Choose a valid plan due date before approval'); return; }
  }
  try{
    const res = await fetch('/api/observations?id='+encodeURIComponent(id), { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await res.json();
    if(!res.ok || !data.success){ toast(data.error||'Failed'); return; }
    closeModal();
    if(decision==='approve'){
      let msg = STATE.lang==='ar'?'تم اعتماد الملاحظة وإنشاء الملاحظة الرسمية':'Observation approved and finding created';
      if(data.recurring) msg += STATE.lang==='ar'?' — ملاحظة متكررة':' — recurring finding';
      if(data.plan){
        msg += data.whatsapp && data.whatsapp.success
          ? (STATE.lang==='ar'?' — تم إرسال طلب خطة تصحيحية فعلي عبر واتساب':' — real WhatsApp corrective-plan request sent')
          : (STATE.lang==='ar'?` — لم يُرسل واتساب: ${data.whatsapp?data.whatsapp.error:''}`:` — WhatsApp not sent: ${data.whatsapp?data.whatsapp.error:''}`);
      }
      toast(msg);
      // Always offer the wa.me fallback too (works even if Twilio isn't configured),
      // so Quality can send the corrective-plan request themselves in one click.
      if(data.plan && payload.responsible_member_id && !(data.whatsapp && data.whatsapp.success)){
        const member = ROUND_MEMBERS.find(m=>String(m.id)===String(payload.responsible_member_id));
        if(member && member.mobile){
          const link = window.location.origin + '/plan/' + data.plan.secure_token;
          const waMsg = waPlanRequestText(member.preferred_language||'ar', payload.responsible_department, data.observation.round_id, data.observation.observation_text, data.plan.start_date, data.plan.due_date, link);
          offerWaMeModal(STATE.lang==='ar'?'إرسال طلب الخطة التصحيحية عبر واتساب':'Send Corrective Plan Request via WhatsApp', member, waMsg);
        }
      }
    } else {
      toast(STATE.lang==='ar'?'تم تسجيل القرار':'Decision recorded');
    }
    if(!document.getElementById('modal-layer').classList.contains('open')) viewQpsReviewAsync();
  } catch(error){ toast(STATE.lang==='ar'?'تعذّر الإرسال':'Request failed'); }
}

async function planLiveAction(id, action, extra){
  try{
    const res = await fetch('/api/plans?id='+encodeURIComponent(id), { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({action, actor: currentActorName()}, extra||{})) });
    const data = await res.json();
    if(!res.ok || !data.success){
      if(data.reasons){ toast((STATE.lang==='ar'?'لا يمكن إغلاق الملاحظة: ':'Cannot close finding: ')+data.reasons.join(' ')); }
      else toast(data.error||'Failed');
      return false;
    }
    toast(data.whatsapp? (data.whatsapp.success? (STATE.lang==='ar'?'تم تنفيذ الإجراء وإرسال واتساب فعلي':'Action recorded and real WhatsApp sent') : (STATE.lang==='ar'?`تم تنفيذ الإجراء — لم يُرسل واتساب: ${data.whatsapp.error}`:`Action recorded — WhatsApp not sent: ${data.whatsapp.error}`)) : (STATE.lang==='ar'?'تم تنفيذ الإجراء':'Action recorded'));
    await viewPlanLiveDetailAsync(id);
    return true;
  } catch(error){ toast(STATE.lang==='ar'?'فشل الإجراء':'Action failed'); return false; }
}
function offerWaMeReminderNow(){
  const { plan, finding } = CURRENT_PLAN_VIEW;
  if(!plan || !finding || !finding.responsible_member_id){ toast(STATE.lang==='ar'?'لا يوجد شخص مسؤول مرتبط برقم جوال':'No linked responsible person with a mobile number'); return; }
  const member = ROUND_MEMBERS.find(m=>String(m.id)===String(finding.responsible_member_id));
  if(!member || !member.mobile){ toast(STATE.lang==='ar'?'لا يوجد رقم جوال محفوظ للمسؤول':'Responsible member has no saved mobile number'); return; }
  const days = Math.round((parseD(plan.due_date) - parseD(todayStr()))/86400000);
  const kind = days<0 ? 'overdue' : days===0 ? 'due_today' : 'before_due';
  const link = window.location.origin + '/plan/' + plan.secure_token;
  const msg = waPlanReminderText(member.preferred_language||'ar', kind, finding.department, finding.round_id, plan.due_date, link);
  offerWaMeModal(STATE.lang==='ar'?'إرسال تذكير عبر واتساب':'Send Reminder via WhatsApp', member, msg);
}

async function submitPlanLiveReason(id, action){
  const notes = document.getElementById('plr-notes').value.trim();
  if(!notes){ toast(STATE.lang==='ar'?'السبب مطلوب':'A reason is required'); return; }
  closeModal();
  const ok = await planLiveAction(id, action, {notes});
  if(ok && ['return_revision','request_evidence'].includes(action)){
    const { plan, finding } = CURRENT_PLAN_VIEW;
    if(plan && finding && finding.responsible_member_id){
      const member = ROUND_MEMBERS.find(m=>String(m.id)===String(finding.responsible_member_id));
      if(member && member.mobile){
        const link = window.location.origin + '/plan/' + plan.secure_token;
        const kind = action==='return_revision' ? 'revision' : 'evidence';
        const msg = waPlanReminderText(member.preferred_language||'ar', kind, finding.department, finding.round_id, plan.due_date, link);
        offerWaMeModal(STATE.lang==='ar'?'إرسال إشعار عبر واتساب':'Send Notice via WhatsApp', member, msg);
      }
    }
  }
}

const FOLLOWUP_LABELS = {
  closed_sustained: {en:'Closed & Sustained', ar:'مغلقة ومستدامة', cls:'b-green'},
  still_open: {en:'Still Open', ar:'ما زالت مفتوحة', cls:'b-amber'},
  overdue: {en:'Overdue', ar:'متأخرة', cls:'b-red'},
  recurred: {en:'Recurred', ar:'تكررت', cls:'b-orange'},
};
async function fetchPreviousFindings(department, excludeRoundId){
  try{
    let url = '/api/previous-findings?department='+encodeURIComponent(department);
    if(excludeRoundId) url += '&exclude_round_id='+encodeURIComponent(excludeRoundId);
    const res = await fetch(url);
    const data = await res.json();
    return (data.success? data.findings : []) || [];
  } catch(error){ return []; }
}

    <th>${STATE.lang==='ar'?'الإغلاق':'Closure'}</th><th>${STATE.lang==='ar'?'الاستحقاق':'Due Date'}</th><th>${STATE.lang==='ar'?'الحالة':'Status'}</th>
  </tr></thead><tbody>
  ${findings.map(f=>{
    const lbl = FOLLOWUP_LABELS[f.follow_up_status] || FOLLOWUP_LABELS.still_open;

    return `<tr>
      <td class="nowrap">${esc(f.round_id)}</td>
      <td>${esc(f.checklist_item||domainName(f.domain))} ${f.is_recurring?`<span class="badge b-orange" style="margin-inline-start:4px;">🔁 ${STATE.lang==='ar'?'ملاحظة متكررة':'Recurring Finding'}</span>`:''}</td>

/* ---------------- Attendance status badge ---------------- */
function attendanceBadgeHtml(status, respondedAt){
  const value = String(status || 'Pending');
  let cls = 'b-amber';
  let label = STATE.lang==='ar' ? '⏳ بانتظار الرد' : '⏳ Pending';

  if(value === 'Confirmed'){
    cls = 'b-green';
    label = STATE.lang==='ar' ? '✓ تم تأكيد الحضور' : '✓ Confirmed';
  } else if(value === 'Declined'){
    cls = 'b-red';
    label = STATE.lang==='ar' ? '✕ تعذر الحضور' : '✕ Declined';
  }

  let title = '';
  if(respondedAt){
    try{
      title = new Date(respondedAt).toLocaleString(STATE.lang==='ar'?'ar-SA':'en-US', { timeZone:'Asia/Riyadh' });
    }catch(_){ title = String(respondedAt); }
  }

  return `<span class="badge ${cls}"${title?` title="${esc(title)}"`:''}>${label}</span>`;
}

async function viewExecutiveReportAsync(roundId){
  const content = document.getElementById('content');

  try{
    const [roundRes, findingsRes] = await Promise.all([
      fetch('/api/rounds?id='+encodeURIComponent(roundId)),
      fetch('/api/findings?round_id='+encodeURIComponent(roundId)),
    ]);
    const roundData = await roundRes.json();
    const findingsData = await findingsRes.json();
    if(!roundData.success){ content.innerHTML = `<div class="card card-pad"><b>${esc(roundData.error||'Round not found')}</b></div>`; return; }
    const round = roundData.round;
    const participants = (roundData.participants||[]).filter(Boolean);
    const findings = (findingsData.success? findingsData.findings : []) || [];
    const approvedRemarks = findings.filter(f=>f.status!=='Rejected');

    // Next round: earliest scheduled round sharing a department, after this one.
    let nextRoundLine = STATE.lang==='ar'?'لم تُحدد بعد':'Not yet scheduled';
    try{
      const allRes = await fetch('/api/rounds');
      const allData = await allRes.json();
      if(allData.success){
        const candidates = (allData.rounds||[]).filter(r=> r.id!==round.id && r.status==='Scheduled' && (r.departments||[]).some(d=>(round.departments||[]).includes(d)) && new Date(r.planned_date) > new Date(round.planned_date));
        candidates.sort((a,b)=>new Date(a.planned_date)-new Date(b.planned_date));
        if(candidates.length) nextRoundLine = candidates[0].id+' — '+fmtDate(candidates[0].planned_date);
      }
    } catch(e){}

    const byDomain = {};
    DOMAINS.forEach(d=>{ byDomain[d.id] = approvedRemarks.filter(f=>f.domain===d.id); });

    content.innerHTML = `
    <div class="btn-row no-print" style="margin-bottom:14px;">
      <button class="btn btn-ghost btn-sm" onclick="go('executive-report')">← ${STATE.lang==='ar'?'رجوع':'Back'}</button>

          <h2 style="font-size:19px;">MONTHLY HOSPITAL SAFETY ROUNDS</h2>

      </div>
      <table style="margin-bottom:14px;"><tbody>
        <tr><td style="width:18%;font-weight:700;">MONTH:</td><td>${fmtDate(round.planned_date)}</td><td style="width:18%;font-weight:700;">ROUND ID:</td><td>${esc(round.id)}</td></tr>
