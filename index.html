<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Safety Rounds | Maternity &amp; Children Hospital — Hafar Al Batin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal-950:#062b2c;
  --teal-900:#0b3d3e;
  --teal-800:#0f5c5c;
  --teal-700:#146b6a;
  --teal-600:#1a8281;
  --teal-100:#e4f2f0;
  --teal-50:#f2f9f8;
  --ink:#0e2326;
  --ink-soft:#3c5457;
  --line:#d9e5e3;
  --line-soft:#e9f1ef;
  --bg:#f4f8f7;
  --card:#ffffff;
  --gold:#b8862f;
  --gold-soft:#f7ecd9;
  --green:#1c8a52;
  --green-soft:#e4f5eb;
  --amber:#b6790a;
  --amber-soft:#fbf0dc;
  --orange:#c15d18;
  --orange-soft:#fbe9db;
  --red:#b6342c;
  --red-soft:#fbe6e4;
  --blue:#1f5fa8;
  --blue-soft:#e6eef8;
  --radius:10px;
  --shadow:0 1px 2px rgba(6,43,44,.06), 0 1px 0 rgba(6,43,44,.03);
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"] body,[dir="rtl"]{font-family:'Tajawal','Manrope',sans-serif;}
h1,h2,h3,h4{font-family:'Source Serif 4', Georgia, serif; font-weight:600; margin:0; letter-spacing:-0.01em;}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4{font-family:'Tajawal',sans-serif; font-weight:700;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
::selection{background:var(--teal-100);}

/* ---------- Shell ---------- */
#shell{display:flex; min-height:100vh;}
#sidebar{
  width:236px; flex:none; background:var(--teal-950); color:#dff0ee;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
[dir="rtl"] #sidebar{order:2;}
.brand{padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-mark{display:flex; align-items:center; gap:10px;}
.brand-icon{width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--teal-600),var(--teal-800));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:800;font-family:'Source Serif 4',serif;flex:none;}
.brand-name{font-size:13.5px; font-weight:700; line-height:1.25; color:#fff;}
.brand-sub{font-size:10.5px; color:#8fb9b5; margin-top:2px;}
nav.navlist{padding:10px 10px; flex:1;}
.nav-group-label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#5f8b87; padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; font-size:13.3px;
  color:#c6e3e0; margin-bottom:1px; cursor:pointer; border:none; background:none; width:100%; text-align:left;
}
[dir="rtl"] .nav-item{text-align:right;}
.nav-item .ic{width:17px;text-align:center;flex:none;font-size:14px;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--teal-700); color:#fff; font-weight:600;}
.nav-badge{margin-inline-start:auto; background:var(--red); color:#fff; font-size:10px; font-weight:700; border-radius:20px; padding:1px 6px; min-width:16px; text-align:center;}
.sidebar-foot{padding:12px 16px 16px; border-top:1px solid rgba(255,255,255,.08); font-size:10.5px; color:#5f8b87;}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  height:60px; flex:none; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center;
  gap:14px; padding:0 20px; position:sticky; top:0; z-index:30;
}
.search-wrap{flex:1; max-width:420px; position:relative;}
.search-wrap input{
  width:100%; padding:8px 12px 8px 34px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
  font-size:13px; color:var(--ink);
}
[dir="rtl"] .search-wrap input{padding:8px 34px 8px 12px;}
.search-wrap .sic{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:13px;}
[dir="rtl"] .search-wrap .sic{left:auto; right:11px;}
.topbar-spacer{flex:1;}
.topbar-btn{position:relative; width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-soft);}
.topbar-btn:hover{background:var(--teal-50); color:var(--teal-800);}
.dot{position:absolute; top:5px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--red); border:2px solid #fff;}
[dir="rtl"] .dot{right:auto; left:6px;}
.lang-switch{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.lang-switch button{padding:7px 11px; font-size:11.5px; font-weight:700; background:#fff; border:none; color:var(--ink-soft);}
.lang-switch button.active{background:var(--teal-800); color:#fff;}
.role-switch select{border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12.5px; background:#fff; color:var(--ink); font-weight:600;}
.profile{display:flex; align-items:center; gap:8px; padding-inline-start:8px; border-inline-start:1px solid var(--line);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}
.profile-txt{font-size:11.5px; line-height:1.3;}
.profile-txt b{display:block; font-size:12.3px; color:var(--ink);}

#content{flex:1; padding:22px 26px 60px; max-width:1440px; width:100%; margin:0 auto;}

/* dropdown */
.dropdown{position:absolute; top:46px; right:0; width:360px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 32px rgba(6,43,44,.18); z-index:80; overflow:hidden;}
[dir="rtl"] .dropdown{right:auto; left:0;}
.dropdown-head{padding:12px 14px; border-bottom:1px solid var(--line-soft); font-weight:700; font-size:13px; display:flex; justify-content:space-between; align-items:center;}
.dropdown-body{max-height:380px; overflow-y:auto;}
.notif-item{padding:11px 14px; border-bottom:1px solid var(--line-soft); font-size:12.3px; display:flex; gap:9px; align-items:flex-start;}
.notif-item:hover{background:var(--teal-50);}
.notif-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
.notif-txt b{display:block; font-size:12.4px; margin-bottom:1px;}
.notif-txt span{color:var(--ink-soft); font-size:11.4px;}

/* ---------- Generic building blocks ---------- */
.pagehead{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; gap:14px; flex-wrap:wrap;}
.pagehead h1{font-size:23px;}
.pagehead .sub{color:var(--ink-soft); font-size:12.8px; margin-top:4px;}
.crumb{font-size:11px; color:var(--teal-700); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:5px;}
.btn{display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:8px; font-size:12.8px; font-weight:700; border:1px solid transparent; white-space:nowrap;}
.btn-primary{background:var(--teal-800); color:#fff;}
.btn-primary:hover{background:var(--teal-900);}
.btn-ghost{background:#fff; border-color:var(--line); color:var(--ink);}
.btn-ghost:hover{background:var(--teal-50); border-color:var(--teal-600);}
.btn-danger{background:#fff; border-color:var(--red); color:var(--red);}
.btn-sm{padding:6px 11px; font-size:11.8px;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}

.grid{display:grid; gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:760px){.g4,.g3,.g2{grid-template-columns:1fr;}}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:16px 18px;}
.card-head{padding:14px 18px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center; gap:10px;}
.card-head h3{font-size:15px;}
.card-head .hint{font-size:11.4px; color:var(--ink-soft); font-weight:500;}

.kpi{padding:15px 16px; border-inline-start:3px solid var(--teal-600); position:relative;}
.kpi .label{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.kpi .num{font-family:'Source Serif 4',serif; font-size:30px; margin-top:4px; line-height:1;}
[dir="rtl"] .kpi .num{font-family:'Tajawal',sans-serif;}
.kpi .delta{font-size:11px; margin-top:6px; color:var(--ink-soft);}
.kpi.st-green{border-color:var(--green);} .kpi.st-amber{border-color:var(--amber);} .kpi.st-red{border-color:var(--red);} .kpi.st-blue{border-color:var(--blue);} .kpi.st-gold{border-color:var(--gold);}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap;}
.b-green{background:var(--green-soft); color:var(--green);}
.b-amber{background:var(--amber-soft); color:var(--amber);}
.b-orange{background:var(--orange-soft); color:var(--orange);}
.b-red{background:var(--red-soft); color:var(--red);}
.b-blue{background:var(--blue-soft); color:var(--blue);}
.b-grey{background:#eef2f1; color:#5b6d6b;}
.b-gold{background:var(--gold-soft); color:var(--gold);}

.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot-green{background:var(--green);} .dot-amber{background:var(--amber);} .dot-red{background:var(--red);} .dot-blue{background:var(--blue);} .dot-grey{background:#9db3b0;}

table{width:100%; border-collapse:collapse; font-size:12.6px;}
thead th{text-align:left; font-size:10.7px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700; padding:9px 12px; border-bottom:1px solid var(--line); background:var(--teal-50);}
[dir="rtl"] thead th{text-align:right;}
tbody td{padding:10px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tbody tr:hover{background:var(--teal-50);}
tbody tr:last-child td{border-bottom:none;}
.tbl-link{color:var(--teal-800); font-weight:700; cursor:pointer;}
.tbl-link:hover{text-decoration:underline;}
.table-wrap{overflow-x:auto;}
.muted{color:var(--ink-soft);}
.right{text-align:right;}
[dir="rtl"] .right{text-align:left;}
.nowrap{white-space:nowrap;}

.progress{height:6px; border-radius:6px; background:var(--line-soft); overflow:hidden;}
.progress > div{height:100%; border-radius:6px; background:var(--teal-600);}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap;}
.tab{padding:9px 14px; font-size:12.6px; font-weight:700; color:var(--ink-soft); border-bottom:2px solid transparent; cursor:pointer;}
.tab.active{color:var(--teal-800); border-color:var(--teal-800);}
.tab:hover{color:var(--teal-900);}

.pill-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.pill-tab{padding:6px 12px; border-radius:20px; font-size:11.8px; font-weight:700; border:1px solid var(--line); background:#fff; color:var(--ink-soft);}
.pill-tab.active{background:var(--teal-800); color:#fff; border-color:var(--teal-800);}

.field{margin-bottom:13px;}
.field label{display:block; font-size:11.6px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:12.8px; font-family:inherit; color:var(--ink); background:#fff;
}
.field textarea{resize:vertical; min-height:64px;}
.field .req{color:var(--red);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:600px){.field-row{grid-template-columns:1fr;}}

.empty{padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:12.8px;}
.empty .eic{font-size:26px; margin-bottom:8px;}

/* modal */
#modal-layer{position:fixed; inset:0; background:rgba(6,25,26,.5); display:none; align-items:flex-start; justify-content:center; z-index:200; padding:40px 16px; overflow-y:auto;}
#modal-layer.open{display:flex;}
.modal{background:#fff; border-radius:12px; width:100%; max-width:640px; box-shadow:0 24px 60px rgba(0,0,0,.3); margin-bottom:40px;}
.modal-head{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{font-size:16px;}
.modal-x{background:none; border:none; font-size:18px; color:var(--ink-soft); width:28px; height:28px; border-radius:6px;}
.modal-x:hover{background:var(--bg);}
.modal-body{padding:18px 20px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}

/* toast */
#toast-layer{position:fixed; bottom:20px; right:20px; z-index:300; display:flex; flex-direction:column; gap:8px;}
[dir="rtl"] #toast-layer{right:auto; left:20px;}
.toast{background:var(--teal-950); color:#fff; padding:11px 16px; border-radius:8px; font-size:12.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); display:flex; align-items:center; gap:8px; min-width:220px;}
.toast .tic{color:var(--green);}

/* domain cards */
.domain-card{border:1px solid var(--line); border-radius:var(--radius); background:#fff; padding:16px; cursor:pointer; transition:box-shadow .15s, border-color .15s;}
.domain-card:hover{border-color:var(--teal-600); box-shadow:var(--shadow);}
.domain-num{width:26px;height:26px;border-radius:7px;background:var(--teal-800);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;}
.domain-card h4{font-size:14.5px; margin-top:10px;}
.domain-card .dsc{font-size:11.8px; color:var(--ink-soft); margin-top:5px; line-height:1.5;}
.domain-card .stat-row{display:flex; justify-content:space-between; align-items:center; margin-top:13px; font-size:11.5px;}
.domain-card .comp{font-weight:800; font-family:'Source Serif 4',serif; font-size:18px;}

/* heatmap */
.heat-wrap{overflow-x:auto;}
.heat-table{border-collapse:separate; border-spacing:3px; font-size:11.3px;}
.heat-table th{font-size:10px; padding:5px 8px; color:var(--ink-soft); font-weight:700; text-align:center;}
.heat-table td.dept-name{text-align:left; font-weight:700; padding:0 10px 0 0; font-size:11.5px; white-space:nowrap;}
[dir="rtl"] .heat-table td.dept-name{text-align:right; padding:0 0 0 10px;}
.heat-cell{width:58px; height:38px; border-radius:6px; text-align:center; vertical-align:middle; font-weight:800; color:#fff; font-size:11.5px;}

/* bars */
.bar-chart{display:flex; align-items:flex-end; gap:10px; height:150px; padding-top:10px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.bar-col .bar{width:100%; max-width:34px; border-radius:5px 5px 0 0; background:var(--teal-600);}
.bar-col .bv{font-size:10.5px; font-weight:800; color:var(--ink);}
.bar-col .bl{font-size:10px; color:var(--ink-soft); text-align:center;}

.checklist-item{border:1px solid var(--line); border-radius:9px; padding:12px 14px; margin-bottom:9px;}
.checklist-item .ci-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
.ci-title{font-size:13px; font-weight:700;}
.ci-opts{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
.ci-opt{padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:#fff; font-size:11.3px; font-weight:700; color:var(--ink-soft);}
.ci-opt.sel-compliant.active{background:var(--green-soft); border-color:var(--green); color:var(--green);}
.ci-opt.sel-partial.active{background:var(--amber-soft); border-color:var(--amber); color:var(--amber);}
.ci-opt.sel-noncompliant.active{background:var(--red-soft); border-color:var(--red); color:var(--red);}
.ci-opt.sel-na.active{background:#eef2f1; border-color:#9db3b0; color:#5b6d6b;}

.side-note{background:var(--teal-50); border:1px solid var(--teal-100); border-radius:9px; padding:12px 14px; font-size:12px; color:var(--teal-900); line-height:1.6;}
.esc-note{background:var(--red-soft); border:1px solid #f0c7c3; border-radius:9px; padding:10px 13px; font-size:11.8px; color:var(--red); line-height:1.55; font-weight:600;}

.timeline{border-inline-start:2px solid var(--line); padding-inline-start:16px; margin-inline-start:6px;}
.tl-item{position:relative; padding-bottom:16px;}
.tl-item:before{content:''; position:absolute; inset-inline-start:-21px; top:2px; width:9px; height:9px; border-radius:50%; background:var(--teal-600); border:2px solid #fff;}
.tl-item b{font-size:12.4px; display:block;}
.tl-item span{font-size:11.3px; color:var(--ink-soft);}

.stepper{display:flex; align-items:center; flex-wrap:wrap; gap:0; margin-bottom:4px;}
.step{font-size:10.6px; font-weight:700; padding:5px 9px; border-radius:20px; background:#eef2f1; color:var(--ink-soft); white-space:nowrap;}
.step.done{background:var(--teal-100); color:var(--teal-800);}
.step.now{background:var(--teal-800); color:#fff;}
.step-arrow{color:var(--line); font-size:11px; padding:0 4px;}

.print-only{display:none;}
@media print{
  #sidebar,#topbar,.btn-row,.no-print{display:none !important;}
  #content{padding:0; max-width:none;}
  body{background:#fff;}
  .print-only{display:block;}
}
.info-banner{background:var(--gold-soft); border:1px solid #ead9b6; color:#7a5a19; font-size:11.6px; padding:9px 14px; border-radius:8px; margin-bottom:16px; line-height:1.5;}
.small-btn-icon{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-soft);}
.small-btn-icon:hover{border-color:var(--teal-600); color:var(--teal-800);}
.chip-list{display:flex; gap:6px; flex-wrap:wrap;}
.chip{background:var(--teal-50); border:1px solid var(--teal-100); color:var(--teal-800); padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700;}
hr.sep{border:none; border-top:1px solid var(--line-soft); margin:16px 0;}
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar"></aside>
  <div id="main">
    <header id="topbar"></header>
    <main id="content"></main>
  </div>
</div>
<div id="modal-layer"><div id="modal-inner"></div></div>
<div id="toast-layer"></div>

<script>
/* =========================================================================
   PATIENT SAFETY ROUNDS — Maternity & Children Hospital, Hafar Al Batin
   Production interface backed by the Patient Safety Rounds APIs / Supabase.
   Operational records are loaded from the live backend; empty states remain empty when no real records exist.
   ========================================================================= */

/* ---------------------------- SYSTEM CLOCK ---------------------------- */
// Live system date used for deadlines, countdowns and status calculations.
const TODAY = new Date();
function todayStr(){ return fmtISO(TODAY); }

/* ---------------------------- I18N ---------------------------- */
const I18N = {
en:{
  dashboard:"Dashboard", calendar:"Calendar", rounds:"Rounds", departments:"Departments",
  domains:"Safety Domains", observations:"Observations", plans:"Improvement Plans",
  overdue:"Overdue Actions", recurring:"Recurring Findings", reports:"Reports",
  evidence:"Evidence", leadership:"Leadership", admin:"Administration",
  search_ph:"Search rounds, observations, people…",
  hospital:"Maternity & Children Hospital — Hafar Al Batin",
  cluster:"Hafr Al Batin Health Cluster · Quality & Patient Safety Management",
  title_main:"Patient Safety Rounds",
  plan_followup:"Plan Follow-Up",
  plan_form_nav:"Corrective Action Evidence",
  notifications_nav:"Notification Center",
  qps_review_nav:"QPS Observation Review",
  findings_live_nav:"Findings by Department",
  plans_live_nav:"Corrective Plans",
  round_followup_nav:"Previous Round Follow-up",
  round_reminders_nav:"Send Round Reminders",
  executive_report_nav:"Executive Report",
},
ar:{
  dashboard:"لوحة القيادة", calendar:"التقويم", rounds:"الجولات", departments:"الأقسام",
  domains:"مجالات سلامة المرضى", observations:"الملاحظات", plans:"خطط التحسين",
  overdue:"الإجراءات المتأخرة", recurring:"الملاحظات المتكررة", reports:"التقارير",
  evidence:"الأدلة", leadership:"القيادة", admin:"الإدارة",
  search_ph:"ابحث في الجولات، الملاحظات، الأشخاص…",
  hospital:"مستشفى الولادة والأطفال - حفر الباطن",

/* ---------------------------- ATTACHMENTS (Official Plan Form + Supporting Evidence) ---------------------------- */
// category: 'plan_form' (the completed, hospital-approved Improvement Plan form — official)
//        or 'evidence'   (supporting evidence — training records, audits, photos, etc.)
// Historical versions are retained (current:false) rather than overwritten, for the audit trail.
let ATTACHMENTS = [];
let ATT_SEQ = 0;
function attachmentsFor(planId, category){ return ATTACHMENTS.filter(a=>a.planId===planId && a.category===category).sort((a,b)=>a.version-b.version); }
function currentAttachment(planId, category){ return attachmentsFor(planId, category).find(a=>a.current) || null; }
function isPlanFormUploaded(planId){ return !!currentAttachment(planId, 'plan_form'); }
function hasEvidence(planId){ return !!currentAttachment(planId, 'evidence') || attachmentsFor(planId,'evidence').length>0; }
function formatFileSize(bytes){ if(bytes<1024) return bytes+' B'; if(bytes<1024*1024) return Math.round(bytes/1024)+' KB'; return (bytes/1024/1024).toFixed(1)+' MB'; }
function currentActorName(){ return STATE.role==='quality'?(STATE.lang==='ar'?'مستخدم الجودة':'Quality Reviewer'):STATE.role==='leadership'?(STATE.lang==='ar'?'القيادة':'Leadership'):(STATE.lang==='ar'?'مستخدم القسم':'Department User'); }
function addAttachment(planId, category, file){
  const prev = attachmentsFor(planId, category);
  const newVersion = prev.length? Math.max(...prev.map(a=>a.version))+1 : 1;
  prev.forEach(a=>{ if(a.current){ a.current=false; } });
  ATT_SEQ++;
  const att = {id:'ATT-'+String(ATT_SEQ).padStart(4,'0'), planId, category, fileName:file.name,
    fileType:(file.name.split('.').pop()||'').toUpperCase(), fileSize:formatFileSize(file.size),
    uploadedBy: currentActorName(), uploadedAt: fmtDateTime(new Date()), templateVersion:activeTemplate().version,
    version:newVersion, current:true, objectUrl: URL.createObjectURL(file)};
  ATTACHMENTS.push(att);
  logAudit(currentActorName(), (category==='plan_form'?'Improvement Plan Form Uploaded':'Evidence Uploaded'), planId,
    `File "${file.name}" (v${newVersion}, ${formatFileSize(file.size)}) uploaded${prev.length? ' — replaces previous version v'+prev[prev.length-1].version : ''}.`);
  return att;
}

/* ---------------------------- WHATSAPP NOTIFICATIONS ----------------------------
   IMPORTANT / HONESTY RULE: this artifact runs entirely in the browser with no
   server-side component. Real WhatsApp delivery requires a backend that holds
   provider credentials securely (Meta Cloud API / Twilio / other) and talks to
   the WhatsApp Business API — that cannot exist inside static, client-side HTML/JS
   without exposing secrets. So this module implements the full configuration UI,
   provider-adapter pattern, test workflow, templates and log exactly as specified,
   but every send/test action is wired to report the true state — configuration
   required — rather than fake a success. Wiring the *_stub functions below to a

// Real, checked backend status — never assumed. Populated by refreshWhatsAppBackendStatus(),
// which calls GET /api/whatsapp-status (a live Twilio credential check, no message sent).
// whatsappBackendConnected() is synchronous because many render() calls read it — it always
// reflects the last real check, defaulting to false (not connected) until one succeeds.
let WA_BACKEND_STATUS = { connected:false, checkedAt:null, detail:null };
function whatsappBackendConnected(){ return WA_BACKEND_STATUS.connected; }
async function refreshWhatsAppBackendStatus(silent){
  try {
    const res = await fetch('/api/whatsapp-status');
    const data = await res.json();
    WA_BACKEND_STATUS.connected = !!data.success;
    WA_BACKEND_STATUS.detail = data;
  } catch(error) {
    WA_BACKEND_STATUS.connected = false;
    WA_BACKEND_STATUS.detail = { success:false, error: error.message };
  }
  WA_BACKEND_STATUS.checkedAt = fmtDateTime(new Date());
  if(!silent) render();
  return WA_BACKEND_STATUS.connected;
}
function whatsappProviderConfigured(){

/* ---------------------------- WHATSAPP SEND VIA TWILIO ----------------------------
   An official, ToS-safe alternative to the Twilio/API path: wa.me just opens the
   person's own WhatsApp with the message pre-filled — they still press Send
   themselves, so it is exactly the same as typing it manually. No credentials,
   no backend call, no risk of a number ban. Used everywhere a real automatic
   send isn't configured/desired. */
function waMeLink(phone, message){
  if(!phone) return null;
  const clean = String(phone).replace(/[^\d]/g,'');
  if(!clean) return null;
  return `https://wa.me/${clean}?text=${encodeURIComponent(message)}`;
}
function waMeButtonHtml(phone, message, label){
  if(!phone) return `<span class="badge b-grey">${STATE.lang==='ar'?'لا يوجد رقم جوال':'No mobile number'}</span>`;
  const p = encodeURIComponent(String(phone));
  const m = encodeURIComponent(String(message || ''));
  return `<button class="btn btn-primary btn-sm" type="button" onclick="waSendDirectTwilio(decodeURIComponent('${p}'),decodeURIComponent('${m}'))">📤 ${esc(label||(STATE.lang==='ar'?'إرسال عبر Twilio':'Send via Twilio'))}</button>`;
}
async function waSendDirectTwilio(phone, message){
  if(!phone){
    toast(STATE.lang==='ar'?'لا يوجد رقم جوال':'No mobile number');
    return false;
  }
  toast(STATE.lang==='ar'?'جاري الإرسال عبر Twilio...':'Sending through Twilio...');
  try{
    const res = await fetch('/api/whatsapp?action=send', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({to:phone, message:message})
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Twilio send failed');
    toast(STATE.lang==='ar'?'تم إرسال الرسالة عبر Twilio بنجاح':'Message sent successfully through Twilio');
    return true;
  }catch(error){
    console.error('Twilio direct send error:', error);
    toast((STATE.lang==='ar'?'فشل الإرسال عبر Twilio: ':'Twilio send failed: ') + (error.message || 'Unknown error'));
    return false;
  }
}

  }

// Scheduling hook: called after a round is persisted (see submitNewRound). Actually
// creates the 24h/1h reminder rows in Supabase via POST /api/create-reminder — the
// existing process-reminders cron (vercel.json, every 5 min) then sends them for real.
// This is async and reflects the true server result; it never fabricates a "Scheduled"
// entry locally without the server having actually written the row.
async function waScheduleRoundReminders(roundId){
  if(!whatsappProviderConfigured()){
    toast(STATE.lang==='ar'?'لم يتم إعداد مزود WhatsApp — لن يتم إنشاء تذكيرات فعلية.':'No WhatsApp provider configured — no real reminders will be created.');
    return { created: 0 };
  }
  try {
    const res = await fetch('/api/create-reminder', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ round_id: roundId })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      toast(whatsappFailureMessage(data.error));
      logAudit(currentActorName(), 'Reminder Creation Failed', 'WhatsApp', `Failed to create reminders for ${roundId}: ${data.error||'unknown error'}`);
      return { created: 0, error: data.error };
    }
    (data.reminders||[]).forEach(row=>{
      waLog({type: row.reminder_type==='24h'?'24-Hour Reminder':'1-Hour Reminder', roundId: row.round_id, recipient: row.recipient_phone, recipientName: row.recipient_name, scheduledTime: row.scheduled_at, sentTime:'—', provider: WHATSAPP_CONFIG.provider||'—', status:'Scheduled', messageId:null, deliveryStatus:'—', error:null, retryCount:0, eventKey: row.event_key});
    });
    if(data.created>0){
      toast(STATE.lang==='ar'?`تم إنشاء ${data.created} تذكير فعلي في قاعدة البيانات`:`${data.created} real reminder(s) queued in the database`);
    } else if(data.message){
      toast(data.message);
    }
    return data;
  } catch(error){
    toast(whatsappFailureMessage(error.message));
    logAudit(currentActorName(), 'Reminder Creation Failed', 'WhatsApp', `Failed to create reminders for ${roundId}: ${error.message}`);
    return { created: 0, error: error.message };
  }
}

/* ---------------------------- STATE ---------------------------- */
const STATE = {

/* ---------------------------- UTILITIES ---------------------------- */
function fmtISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function fmtDateTime(d){ return fmtISO(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function parseD(s){ if(typeof s!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d]=s.split('-').map(Number); const date=new Date(y,m-1,d); return Number.isNaN(date.getTime())?null:date; }
function fmtDate(s){ if(!s) return '—'; const d=parseD(s); if(!d) return '—'; const months=STATE.lang==='ar'
  ? ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر']
  : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }

function roundById(id){ return ROUNDS.find(r=>r.id===id); }
function obsById(id){ return OBSERVATIONS.find(o=>o.id===id); }
function planById(id){ return PLANS.find(p=>p.id===id); }
function planForObs(obsId){ return PLANS.find(p=>p.obsId===obsId); }

// Next scheduled round date for a department, after a given date
function nextRoundDateForDept(deptId, afterISO){
  const after = parseD(afterISO);
  const candidates = ROUNDS.filter(r=> r.depts.includes(deptId) && r.status==='Scheduled' && parseD(r.plannedDate) > after);
  candidates.sort((a,b)=> parseD(a.plannedDate)-parseD(b.plannedDate));
  return candidates.length? candidates[0].plannedDate : null;
}

function planTargetDateStr(startISO, deptId){
  // Business rule: due date = one day before the next scheduled Patient Safety
  // Round for the same department, per the official Patient Safety Walkrounds Schedule.
  const start = parseD(startISO);
  const nextRound = nextRoundDateForDept(deptId, startISO);
  let target;
  if(!nextRound) return null;
  target = new Date(parseD(nextRound));
  target.setDate(target.getDate()-1);
  if(target<=start) return null;
  return fmtISO(target);
}
// Recalculates due dates for all non-closed, non-manually-overridden plans from the
// official schedule. Called whenever a round is scheduled/rescheduled so due dates
// automatically follow the next round date for each department.
function recalcAllDueDates(){
  let changed = 0;
  PLANS.filter(p=>p.status!=='Closed' && !p.manualOverride).forEach(p=>{
    const o = obsById(p.obsId);
    if(!o) return;
    const newTarget = planTargetDateStr(p.startDate, o.dept);
    if(newTarget!==p.targetDate){
      logAudit('System', 'Due Date Recalculated', p.id, `Target date updated from ${p.targetDate?fmtDate(p.targetDate):'Not scheduled'} to ${newTarget?fmtDate(newTarget):'Not scheduled'} following a schedule change (next round for ${deptName(o.dept)}).`);
      p.targetDate = newTarget; p.followUpDate = newTarget; changed++;
    }
  });
  return changed;
}

function deadlineInfo(targetISO, status){
  if(!targetISO) return {label:'—', cls:'muted', overdueDays:0};
  const target = parseD(targetISO);
  const closed = (status==='Closed'||status==='Verified');
  const diff = daysBetween(TODAY, target); // positive = days remaining
  if(closed) return {label: STATE.lang==='ar'?'مكتمل':'Completed', cls:'b-green', overdueDays:0, done:true};
  if(diff>0) return {label:(STATE.lang==='ar'?`متبقي ${diff} يوم`:`${diff} day${diff===1?'':'s'} remaining`), cls: diff<=3?'b-amber':'b-blue', overdueDays:0};
  if(diff===0) return {label: STATE.lang==='ar'?'يستحق اليوم':'Due today', cls:'b-orange', overdueDays:0};
  const od = -diff;
  return {label:(STATE.lang==='ar'?`متأخر ${od} يوم`:`${od} day${od===1?'':'s'} overdue`), cls:'b-red', overdueDays:od};
}

function escalationTier(overdueDays, risk){
  if(overdueDays<=0) return null;
  if(overdueDays>=1 && overdueDays<=3) return {en:'Department Escalation', ar:'تصعيد للقسم', cls:'b-amber'};
  if(overdueDays>=4 && overdueDays<=7) return {en:'Quality & Patient Safety Escalation', ar:'تصعيد لإدارة الجودة وسلامة المرضى', cls:'b-orange'};
  return {en:'Leadership Escalation', ar:'تصعيد للإدارة العليا', cls:'b-red'};
}

function isRecurring(obs){
  return OBSERVATIONS.some(o2=> o2.id!==obs.id && o2.dept===obs.dept && o2.domain===obs.domain && o2.item===obs.item && parseD(o2.createdDate) < parseD(obs.createdDate));
}
function occurrencesOf(obs){
  return OBSERVATIONS.filter(o2=> o2.dept===obs.dept && o2.domain===obs.domain && o2.item===obs.item)
    .sort((a,b)=> parseD(a.createdDate)-parseD(b.createdDate));
}
// Prominent finding status for previous-round review, per spec: CLOSED–VERIFIED / OPEN / OVERDUE / RECURRED
function prominentFindingStatus(o){
  const p = planForObs(o.id);
  if(p && p.status==='Closed') return {key:'closed', en:'CLOSED – VERIFIED', ar:'مغلقة – تم التحقق', cls:'b-green'};
  if(p){
    const info = deadlineInfo(p.targetDate, p.status);
    if(info.overdueDays>0) return {key:'overdue', en:'OVERDUE', ar:'متأخرة', cls:'b-red'};
  }
  if(isRecurring(o)) return {key:'recurred', en:'RECURRED', ar:'تكررت', cls:'b-orange'};
  return {key:'open', en:'OPEN', ar:'مفتوحة', cls:'b-blue'};
}
function allRecurringGroups(){
  const map = {};
  OBSERVATIONS.forEach(o=>{ const k=o.dept+'|'+o.domain+'|'+o.item; (map[k]=map[k]||[]).push(o); });
  return Object.values(map).filter(arr=>arr.length>1).map(arr=> arr.sort((a,b)=>parseD(a.createdDate)-parseD(b.createdDate)));
}

function roundStatusComputed(r){
  if(r.status==='Completed') return 'Completed';
  if(r.status==='Missed') return 'Missed';
  if(r.status==='Cancelled') return 'Cancelled';
  if(r.status==='Rescheduled') return 'Rescheduled';
  const days = daysBetween(TODAY, parseD(r.plannedDate));
  if(days<0) return 'RequiresConfirmation'; // scheduled date has passed — Quality must confirm what actually happened
  if(days<=3) return 'DueSoon';
  return 'Upcoming';
}

    RequiresConfirmation:{cls:'b-orange', en:'Requires Confirmation', ar:'يتطلب تأكيدًا', ic:'🟠'},
  };
  const m = map[s];
  return `<span class="badge ${m.cls}">${m.ic} ${STATE.lang==='ar'?m.ar:m.en}</span>`;
}
// Historical-round confirmation (spec: never auto-mark a scheduled round as completed).
function confirmRound(roundId, decision){

  else if(decision==='rescheduled'){ r.status='Rescheduled'; logAudit(currentActorName(),'Round Marked Rescheduled',roundId,'Round marked as rescheduled. Use "Schedule New Round" to record the new date.'); toast(STATE.lang==='ar'?'تم وضع علامة إعادة الجدولة':'Round marked as rescheduled'); }

  else { logAudit(currentActorName(),'Round Confirmation Deferred — Unknown',roundId,'Status marked unknown/requires follow-up; round remains pending confirmation.'); toast(STATE.lang==='ar'?'تم تسجيل الحالة كغير معروفة':'Marked unknown — still requires confirmation'); }
  go('round-detail',{id:roundId, tab: decision==='completed'?'run':'summary'});
}

function roundCompliance(roundId){
  const obs = OBSERVATIONS.filter(o=>o.roundId===roundId);
  const r = roundById(roundId);
  const checklistCount = r.depts.reduce((s,d)=> s+checklistFor(d).length, 0);
  if(!checklistCount) return 100;
  const nonCompliantWeight = obs.length; // simplified: each finding = one non-compliant checkpoint
  const compliantCount = Math.max(checklistCount - nonCompliantWeight, 0);
  return Math.round((compliantCount/checklistCount)*100);
}
function overallCompliance(){
  const completed = ROUNDS.filter(r=>r.status==='Completed');
  if(!completed.length) return 100;
  const vals = completed.map(r=>roundCompliance(r.id));
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function deptCompliance(deptId){
  const rs = ROUNDS.filter(r=> r.status==='Completed' && r.depts.includes(deptId));
  if(!rs.length) return null;
  const vals = rs.map(r=>roundCompliance(r.id));
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function domainCompliance(domainId){
  const relevantObs = OBSERVATIONS.filter(o=>o.domain===domainId);
  const domain = DOMAINS.find(d=>d.id===domainId);
  const depts = domain.scope==='ALL' ? DEPARTMENTS.map(d=>d.id) : domain.scope;
  const completedRounds = ROUNDS.filter(r=> r.status==='Completed' && r.depts.some(d=>depts.includes(d)));
  let totalCheckpoints=0, findings=0;
  completedRounds.forEach(r=>{ r.depts.forEach(d=>{ if(depts.includes(d)) totalCheckpoints += domain.items.length; }); });
  findings = relevantObs.filter(o=> completedRounds.some(r=>r.id===o.roundId)).length;
  if(!totalCheckpoints) return {pct:100, findings:0, high:0, open:0};
  const pct = Math.max(Math.round(((totalCheckpoints-findings)/totalCheckpoints)*100),0);
  const high = relevantObs.filter(o=>(o.risk==='High'||o.risk==='Critical')).length;
  const open = relevantObs.filter(o=>{ const p=planForObs(o.id); return p && !['Closed'].includes(p.status); }).length;
  return {pct, findings:relevantObs.length, high, open};
}
function heatCell(deptId, domainId){
  const domain = DOMAINS.find(d=>d.id===domainId);
  if(!domainApplies(domain, deptId)) return null;
  const rs = ROUNDS.filter(r=> r.status==='Completed' && r.depts.includes(deptId));
  if(!rs.length) return null;
  const checkpoints = domain.items.length * rs.length;
  const findings = OBSERVATIONS.filter(o=> o.dept===deptId && o.domain===domainId && rs.some(r=>r.id===o.roundId)).length;
  return Math.max(Math.round(((checkpoints-findings)/checkpoints)*100),0);
}

function heatColor(pct){
  if(pct>=90) return 'var(--green)';
  if(pct>=75) return 'var(--amber)';
  return 'var(--red)';
}

/* ---------------------------- NOTIFICATIONS ---------------------------- */
function buildNotifications(){
  const list = [];
  ROUNDS.filter(r=>r.status==='Scheduled').forEach(r=>{
    const days = daysBetween(TODAY, parseD(r.plannedDate));
    if(days===7||days===3||days===1||days===0){
      list.push({type:'round', ic:'🔔', cls:'b-blue', date:r.plannedDate,
        titleEn:`Round ${r.id} — ${days===0?'Today':days+' day(s) before'}`,
        titleAr:`جولة ${r.id} — ${days===0?'اليوم':'قبل '+days+' يوم'}`,
        subEn:r.depts.map(deptName).join(' + '), subAr:r.depts.map(deptName).join(' + '), link:{view:'round-detail', params:{id:r.id}}});
    }
  });
  PLANS.forEach(p=>{
    if(['Closed'].includes(p.status)) return;
    const info = deadlineInfo(p.targetDate, p.status);
    const obs = obsById(p.obsId);
    if(info.overdueDays>0){
      const tier = escalationTier(info.overdueDays, obs.risk);
      list.push({type:'overdue', ic:'🔔', cls:tier.cls, date:p.targetDate,
        titleEn:`Action overdue — ${p.id}`, titleAr:`إجراء متأخر — ${p.id}`,
        subEn:`${deptName(obs.dept)} · ${tier.en}`, subAr:`${deptName(obs.dept)} · ${tier.ar}`, link:{view:'plan-detail', params:{id:p.id}}});
    } else if(info.overdueDays===0 && daysBetween(TODAY, parseD(p.targetDate))<=3){
      list.push({type:'due', ic:'🔔', cls:'b-amber', date:p.targetDate,
        titleEn:`Action due soon — ${p.id}`, titleAr:`إجراء يستحق قريبًا — ${p.id}`,
        subEn:deptName(obs.dept), subAr:deptName(obs.dept), link:{view:'plan-detail', params:{id:p.id}}});
    }
    if(p.status==='Plan Submitted' || p.status==='Under Quality Review'){
      list.push({type:'review', ic:'🔔', cls:'b-orange', date:p.followUpDate||p.targetDate,
        titleEn:`Quality review pending — ${p.id}`, titleAr:`بانتظار مراجعة الجودة — ${p.id}`,
        subEn:deptName(obs.dept), subAr:deptName(obs.dept), link:{view:'plan-detail', params:{id:p.id}}});
    }
    if(p.status==='Evidence Submitted' || p.status==='Under Verification'){
      list.push({type:'verify', ic:'🔔', cls:'b-orange', date:p.followUpDate||p.targetDate,
        titleEn:`Verification required — ${p.id}`, titleAr:`مطلوب تحقق — ${p.id}`,
        subEn:deptName(obs.dept), subAr:deptName(obs.dept), link:{view:'plan-detail', params:{id:p.id}}});
    }
    if(p.status==='Revision Required'){
      list.push({type:'revision', ic:'🔔', cls:'b-red', date:p.followUpDate||p.targetDate,
        titleEn:`Revision required — ${p.id}`, titleAr:`مطلوب تعديل — ${p.id}`,
        subEn:deptName(obs.dept), subAr:deptName(obs.dept), link:{view:'plan-detail', params:{id:p.id}}});
    }
    if((obs.risk==='High'||obs.risk==='Critical') && !['Closed'].includes(p.status)){
      list.push({type:'risk', ic:'🔔', cls:'b-red', date:obs.createdDate,
        titleEn:`${obs.risk} finding open — ${obs.id}`, titleAr:`ملاحظة ${riskLabel(obs.risk)} مفتوحة — ${obs.id}`,
        subEn:deptName(obs.dept), subAr:deptName(obs.dept), link:{view:'obs-detail', params:{id:obs.id}}});
    }
  });
  allRecurringGroups().forEach(g=>{
    const latest = g[g.length-1];
    const p = planForObs(latest.id);
    if(p && !['Closed'].includes(p.status)){
      list.push({type:'recurring', ic:'🔔', cls:'b-orange', date:latest.createdDate,
        titleEn:`Recurring finding — ${latest.id} (${g.length}×)`, titleAr:`ملاحظة متكررة — ${latest.id} (${g.length}×)`,
        subEn:deptName(latest.dept), subAr:deptName(latest.dept), link:{view:'obs-detail', params:{id:latest.id}}});
    }
  });
  list.sort((a,b)=> parseD(b.date)-parseD(a.date));
  return list;
}

function viewDashboard(){
  const totalRounds = ROUNDS.filter(r=>String(r.id ?? '').startsWith('PSR-2026')).length;
  const completed = ROUNDS.filter(r=>r.status==='Completed' && String(r.id ?? '').startsWith('PSR-2026')).length;
  const upcoming = ROUNDS.filter(r=>r.status==='Scheduled' && ['Upcoming','DueSoon'].includes(roundStatusComputed(r))).length;
  const missed = ROUNDS.filter(r=>roundStatusComputed(r)==='Missed').length;
  const needsConfirmation = ROUNDS.filter(r=>roundStatusComputed(r)==='RequiresConfirmation').length;
  const totalFindings = OBSERVATIONS.length;
  const openFindings = OBSERVATIONS.filter(o=>{ const p=planForObs(o.id); return p && !['Closed'].includes(p.status); }).length;
  const highCrit = OBSERVATIONS.filter(o=> (o.risk==='High'||o.risk==='Critical') && (()=>{const p=planForObs(o.id); return p && !['Closed'].includes(p.status);})() ).length;
  const overdueActs = overdueCount();
  const closedActs = PLANS.filter(p=>p.status==='Closed').length;
  const recurring = allRecurringGroups().length;
  const compliance = overallCompliance();

  const nextRound = ROUNDS.filter(r=>r.status==='Scheduled' && roundStatusComputed(r)!=='RequiresConfirmation').sort((a,b)=>parseD(a.plannedDate)-parseD(b.plannedDate))[0];
  const daysRem = nextRound ? daysBetween(TODAY, parseD(nextRound.plannedDate)) : null;

/* ================= LIVE ROUND MANAGEMENT ================= */
function apiRoundToLocal(r){
  return {id:r.id,depts:r.departments||[],plannedDate:r.planned_date||'',plannedTime:r.planned_time||'',
    team:r.team||'QPS Rounds Team',lead:r.lead_reviewer||'To be assigned',
    rep:r.department_representative||'To be assigned',notes:r.notes||'',status:r.status||'Scheduled',
    completedDate:r.completed_date||null,secureToken:r.secure_token||null};
}
async function loadLiveRounds(){
  try{
    const res=await fetch('/api/rounds',{cache:'no-store'});
    const data=await res.json();
    if(!res.ok||!data.success) throw new Error(data.error||'Could not load rounds');
    const live=(data.rounds||[]).map(apiRoundToLocal);
    // Production rule: when Supabase responds, it is the source of truth.
    // Never mix live records with the static fallback/sample records.
    ROUNDS=live;
    WA_ADMIN_STATE.rounds=data.rounds||[];
    if(WA_ADMIN_STATE.selectedRoundId&&!WA_ADMIN_STATE.rounds.some(r=>String(r.id)===String(WA_ADMIN_STATE.selectedRoundId))) WA_ADMIN_STATE.selectedRoundId='';
    if(!WA_ADMIN_STATE.selectedRoundId&&WA_ADMIN_STATE.rounds.length) WA_ADMIN_STATE.selectedRoundId=WA_ADMIN_STATE.rounds[0].id;
    renderShell(); render();
  }catch(e){console.error(e);toast((STATE.lang==='ar'?'تعذر تحميل الجولات: ':'Could not load rounds: ')+e.message);}
}
function apiFindingToLocal(f){
  return {
    id:f.id, roundId:f.round_id, dept:f.department, domain:f.domain,
    item:f.checklist_item||'', location:f.location||'', text:f.observation_text||f.finding_text||'',
    evidence:f.evidence_note||'', risk:f.risk_level||'Low', immediateAction:f.immediate_action||'',
    respDept:f.responsible_department||f.department, respPerson:f.responsible_person||'',
    recAction:f.recommended_action||'', comments:f.qps_notes||'',
    createdDate:(f.created_at||'').slice(0,10), status:f.status||'Open',
    planId:f.plan?f.plan.id:null, isRecurring:!!f.is_recurring
  };
}
function apiPlanToLocal(p, finding){
  return {
    id:p.id, obsId:(finding&&finding.id)||p.finding_id,
    problem:(finding&&(finding.observation_text||finding.finding_text||finding.checklist_item))||'',
    rootCause:p.root_cause||'', contributing:p.contributing_factors||'',
    correctiveAction:p.corrective_action||'', preventiveAction:p.preventive_action||'',
    respDept:(finding&&(finding.responsible_department||finding.department))||'',
    respPerson:p.department_responsible_person||(finding&&finding.responsible_person)||'',
    startDate:p.start_date||'', targetDate:p.due_date||'', followUpDate:p.follow_up_date||'',
    requiredEvidence:p.required_evidence||'', progress:Number(p.progress||0), status:p.status||'Not Started',
    verification:p.verification_result?{by:p.verified_by||'',date:p.verification_date||'',result:p.verification_result,
      evidenceReviewed:!!p.evidence_reviewed,effectivenessConfirmed:!!p.effectiveness_confirmed,
      comments:p.verification_comments||'',finalClosureDecision:p.status==='Closed'?'Closed':''}:null,
    closureDate:p.closure_date||null
  };
}
async function loadLiveOperationalData(){
  try{
    const res=await fetch('/api/findings',{cache:'no-store'});
    const data=await res.json();
    if(!res.ok||!data.success) throw new Error(data.error||'Could not load findings');
    const findings=data.findings||[];
    OBSERVATIONS=findings.map(apiFindingToLocal);
    PLANS=findings.filter(f=>f.plan).map(f=>apiPlanToLocal(f.plan,f));
    // Production mode never uses invented attachment metadata. Detailed evidence is loaded per plan from /api/plans?id=...
    ATTACHMENTS=[];
    renderShell(); render();
  }catch(e){
    console.error(e);
    OBSERVATIONS=[]; PLANS=[]; ATTACHMENTS=[];
    toast((STATE.lang==='ar'?'تعذر تحميل بيانات الملاحظات والخطط: ':'Could not load findings/plans: ')+e.message);
  }
}

async function saveEditedRound(id){
  const departments=Array.from(document.getElementById('er-depts').selectedOptions).map(o=>o.value);
  const planned_date=document.getElementById('er-date').value, planned_time=document.getElementById('er-time').value;
  if(!departments.length||!planned_date||!planned_time){toast(STATE.lang==='ar'?'القسم والتاريخ والوقت مطلوبة':'Department, date and time required');return;}
  const payload={departments,planned_date,planned_time,team:document.getElementById('er-team').value||'QPS Rounds Team',
    lead_reviewer:document.getElementById('er-lead').value||'To be assigned',
    department_representative:document.getElementById('er-rep').value||'To be assigned',
    notes:document.getElementById('er-notes').value||'',actor:currentActorName()};
  try{
    const res=await fetch('/api/rounds?id='+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json(); if(!res.ok||!data.success)throw new Error(data.error||'Update failed');
    closeModal(); await loadLiveRounds();
    try{await fetch('/api/create-reminder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({round_id:id,replace_existing:true})});}catch(e){}
    toast(STATE.lang==='ar'?'تم تعديل الجولة':'Round updated'); go('rounds');
  }catch(e){toast((STATE.lang==='ar'?'فشل تعديل الجولة: ':'Update failed: ')+e.message);}
}
async function deleteRoundLive(id){
  if(!confirm(STATE.lang==='ar'?`هل تريدين حذف الجولة ${id}؟`:`Delete round ${id}?`))return;
  try{
    const res=await fetch('/api/rounds?id='+encodeURIComponent(id),{method:'DELETE'});
    const data=await res.json(); if(!res.ok||!data.success)throw new Error(data.error||'Delete failed');
    ROUNDS=ROUNDS.filter(r=>String(r.id)!==String(id)); WA_ADMIN_STATE.rounds=WA_ADMIN_STATE.rounds.filter(r=>String(r.id)!==String(id));
    if(String(WA_ADMIN_STATE.selectedRoundId)===String(id))WA_ADMIN_STATE.selectedRoundId='';
    toast(STATE.lang==='ar'?'تم حذف الجولة':'Round deleted'); go('rounds');
  }catch(e){toast((STATE.lang==='ar'?'فشل حذف الجولة: ':'Delete failed: ')+e.message);}
}

async function submitNewRound(id){
  const sel = Array.from(document.getElementById('nr-depts').selectedOptions).map(o=>o.value);
  const date = document.getElementById('nr-date').value;
  const time = document.getElementById('nr-time').value;
  const team = document.getElementById('nr-team').value || 'QPS Rounds Team';
  const lead = document.getElementById('nr-lead').value || 'To be assigned';
  const rep = document.getElementById('nr-rep').value || 'To be assigned';
  const notes = document.getElementById('nr-notes').value;
  const memberIds = Array.from(document.getElementById('nr-members').selectedOptions).map(o=>o.value).filter(v=>v);
  if(!sel.length || !date){ toast(STATE.lang==='ar'?'يرجى اختيار القسم والتاريخ':'Please select at least one department and a date'); return; }

  const r = {id, depts:sel, plannedDate:date, plannedTime:time, team, lead, rep, notes, status:'Scheduled'};
  ROUNDS.push(r);
  logAudit(STATE.lang==='ar'?'مستخدم الجودة':'Quality User', 'Round Scheduled', id, `Round scheduled for ${sel.map(deptName).join(' + ')} on ${date}. Reminder schedule, department checklist and previous-findings link created automatically.`);
  recalcAllDueDates();

  // Persist to Supabase (POST /api/rounds) so it survives a refresh and so the
  // reminder-creation endpoint has a real round + secure_token to attach to.
  try {
    const res = await fetch('/api/rounds', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id, departments: sel, planned_date: date, planned_time: time, team, lead_reviewer: lead, department_representative: rep, notes, member_ids: memberIds, actor: currentActorName() })
    });
    const data = await res.json();
    if(res.ok && data.success){
      r.secureToken = data.round.secure_token;
      r.secureLink = data.secure_link;
      toast((STATE.lang==='ar'?'تم حفظ الجولة في قاعدة البيانات ':'Round saved to the database: ')+id);
      await waScheduleRoundReminders(id);
    } else {
      toast(STATE.lang==='ar'?`تم إنشاء الجولة محليًا فقط — فشل الحفظ في قاعدة البيانات: ${data.error||''}`:`Round created locally only — database save failed: ${data.error||''}`);
    }
  } catch(error){
    toast(STATE.lang==='ar'?'تعذّر الاتصال بقاعدة البيانات لحفظ الجولة':'Could not reach the database to save the round');
  }

  toast((STATE.lang==='ar'?'تم جدولة الجولة ':'Round scheduled: ')+id);
  go('round-detail',{id, tab:'prep'});
}

function roundTimelineStages(r){
  const obs = OBSERVATIONS.filter(o=>o.roundId===r.id);
  const plans = obs.map(o=>planForObs(o.id)).filter(Boolean);
  const anyPlanSubmitted = plans.some(p=>['Plan Submitted','Under Quality Review','Approved','Implementation in Progress','Evidence Submitted','Under Verification','Closed'].includes(p.status));
  const anyEvidence = plans.some(p=>hasEvidence(p.id));
  const anyUnderVerification = plans.some(p=>['Evidence Submitted','Under Verification','Closed'].includes(p.status));
  const allClosed = plans.length>0 && plans.every(p=>p.status==='Closed');
  const stages = [
    {key:'scheduled', label:{en:'Scheduled', ar:'مجدولة'}, done:true, date:r.plannedDate},
    {key:'prep', label:{en:'Pre-Round', ar:'التحضير للجولة'}, done:true, date:r.plannedDate},
    {key:'conducted', label:{en:'Round Conducted', ar:'تم تنفيذ الجولة'}, done: r.status==='Completed', date:r.completedDate||''},
    {key:'findings', label:{en:'Findings Created', ar:'تم تسجيل الملاحظات'}, done: obs.length>0, date: obs.length? obs[0].createdDate : ''},
    {key:'plans', label:{en:'Plans Submitted', ar:'تم تقديم الخطط'}, done: anyPlanSubmitted, date:''},
    {key:'evidence', label:{en:'Evidence Submitted', ar:'تم رفع الأدلة'}, done: anyEvidence, date:''},
    {key:'verification', label:{en:'Quality Verification', ar:'التحقق من الجودة'}, done: anyUnderVerification, date:''},
    {key:'closed', label:{en:'Closed', ar:'مغلقة'}, done: allClosed, date:''},
  ];
  return stages;
}

function refreshObsItemOptions(preselectId){
  const domId = document.getElementById('of-domain').value;
  const domain = DOMAINS.find(d=>d.id===domId);
  const sel = document.getElementById('of-item');
  sel.innerHTML = domain.items.map(i=>`<option value="${i.id}" ${i.id===preselectId?'selected':''}>${STATE.lang==='ar'?i.ar:i.en}</option>`).join('');
}
function submitObservation(roundId, id){
  const text = document.getElementById('of-text').value.trim();
  if(!text){ toast(STATE.lang==='ar'?'يرجى إدخال نص الملاحظة':'Please enter the observation text'); return; }
  const dept = document.getElementById('of-dept').value;
  const domain = document.getElementById('of-domain').value;
  const item = document.getElementById('of-item').value;
  const risk = document.getElementById('of-risk').value;
  const obs = {
    id, roundId, dept, domain, item,
    location: document.getElementById('of-loc').value,
    text, evidence: document.getElementById('of-evidence').value,
    risk, immediateAction: document.getElementById('of-immediate').value,
    respDept: document.getElementById('of-respdept').value,
    respPerson: document.getElementById('of-respperson').value || 'To be assigned',
    recAction: document.getElementById('of-recaction').value,
    comments: document.getElementById('of-comments').value,
    createdDate: todayStr(), status:'Open',
  };
  OBSERVATIONS.push(obs);
  // Auto-create improvement plan
  const r = roundById(roundId);
  const start = new Date(parseD(r.plannedDate)); start.setDate(start.getDate()+1);
  const startISO = fmtISO(start.getTime() > TODAY.getTime() ? start : new Date(TODAY.getTime()+86400000));
  const target = planTargetDateStr(r.plannedDate, dept);
  const planId = nextPlanIdSeq();
  const plan = {
    id:planId, obsId:id, problem:text, rootCause:'', contributing:'',
    correctiveAction: obs.recAction || '', preventiveAction:'',
    respDept: obs.respDept, respPerson: obs.respPerson,
    startDate: fmtISO(start), targetDate: target, followUpDate: target,
    requiredEvidence:'Supporting evidence appropriate to the corrective action', progress:0, status:'Plan Requested',
  };
  PLANS.push(plan);
  obs.planId = planId;
  const recurring = isRecurring(obs);
  logAudit(STATE.lang==='ar'?'المراجع':'Reviewer', 'Observation Recorded', id, `New observation recorded for ${deptName(dept)} (${domainName(domain)}). Improvement plan ${planId} auto-created — start ${fmtISO(start)}, due ${target} (one day before next scheduled round). Supporting evidence may be uploaded directly in the corrective-action workflow.`);
  closeModal();
  toast((STATE.lang==='ar'?'تم حفظ الملاحظة وإنشاء خطة تحسين تلقائيًا ':'Observation saved — improvement plan auto-created: ')+planId + (recurring? (STATE.lang==='ar'?' (متكررة)':' (recurring)'):''));
  render();
}

function findingJourneyStages(o, p){
  const stages = [
    {key:'finding', label:{en:'Finding', ar:'الملاحظة'}, done:true},
    {key:'plan', label:{en:'Improvement Plan', ar:'خطة التحسين'}, done: !!p},
    {key:'implementation', label:{en:'Implementation', ar:'التنفيذ'}, done: p && ['Implementation in Progress','Evidence Submitted','Under Verification','Closed'].includes(p.status)},
    {key:'evidence', label:{en:'Evidence', ar:'الأدلة'}, done: p && hasEvidence(p.id)},
    {key:'review', label:{en:'Quality Review', ar:'مراجعة الجودة'}, done: p && ['Approved','Implementation in Progress','Evidence Submitted','Under Verification','Closed'].includes(p.status)},
    {key:'effectiveness', label:{en:'Effectiveness', ar:'الفاعلية'}, done: p && !!p.verification},
    {key:'closure', label:{en:'Closure', ar:'الإغلاق'}, done: p && p.status==='Closed'},
  ];
  return stages;
}
function findingJourneyHtml(o, p){

    <div class="card-head"><h3>${STATE.lang==='ar'?'مسار الملاحظة':'Finding Journey'}</h3></div>
    <div class="card-pad"><div class="stepper">${stages.map((s,i)=>`<span class="step ${s.done?'done':''} ${i===curIdx?'now':''}">${STATE.lang==='ar'?s.label.ar:s.label.en}</span>${i<stages.length-1?'<span class="step-arrow">›</span>':''}`).join('')}</div></div>
  </div>`;
}

/* ---------------- Workflow transition handlers ---------------- */
function savePlanProgress(id){
  const p = planById(id);
  p.progress = parseInt(document.getElementById('pu-progress').value,10);
  const comment = document.getElementById('pu-comment').value;
  if(p.progress>0 && ['Approved'].includes(p.status)){ p.status='Implementation in Progress'; }
  logAudit(p.respPerson,'Progress Updated',id,`Progress set to ${p.progress}%.${comment?' Comment: '+comment:''}`);
  toast(STATE.lang==='ar'?'تم حفظ التحديث':'Progress update saved');
  go('plan-detail',{id});
}
function submitForQualityReview(id){
  const p = planById(id);
  p.status='Plan Submitted';
  logAudit(p.respPerson,'Plan Submitted for Quality Review',id,'Department submitted the corrective action for Quality & Patient Safety review.');
  toast(STATE.lang==='ar'?'تم تقديم الخطة لمراجعة الجودة':'Plan submitted for Quality review');
  go('plan-detail',{id});
}
function decidePlan(id, decision){
  const p = planById(id);
  const commentEl = document.getElementById('qr-comment');
  const comment = commentEl ? commentEl.value.trim() : '';
  if((decision==='revise'||decision==='reject') && !comment){ toast(STATE.lang==='ar'?'التعليق مطلوب عند طلب التعديل أو الرفض':'A comment is required when requesting revision or rejecting'); return; }
  if(decision==='approve'){ p.status='Approved'; logAudit('Quality Reviewer','Plan Approved',id,'Quality & Patient Safety approved the submitted improvement plan.'+(comment?' Comment: '+comment:'')); toast(STATE.lang==='ar'?'تم اعتماد الخطة':'Plan approved'); }
  else if(decision==='revise'){ p.status='Revision Required'; p.reviewComment=comment; logAudit('Quality Reviewer','Revision Requested',id,'Quality & Patient Safety requested revisions to the submitted plan. Reason: '+comment); toast(STATE.lang==='ar'?'تم طلب تعديل الخطة':'Revision requested'); }
  else { p.status='Revision Required'; p.reviewComment=comment; logAudit('Quality Reviewer','Plan Rejected / Further Action Required',id,'Quality & Patient Safety rejected the submitted plan — further action required before resubmission. Reason: '+comment); toast(STATE.lang==='ar'?'تم رفض الخطة — مطلوب إجراء إضافي':'Plan rejected — further action required'); }
  go('plan-detail',{id});
}
function beginImplementation(id){
  const p = planById(id);
  if(p.status==='Approved'){ p.status='Implementation in Progress'; logAudit(p.respPerson,'Implementation Started',id,'Department began implementing the approved improvement plan.'); }
  toast(STATE.lang==='ar'?'بدأ التنفيذ':'Implementation started');
  go('plan-detail',{id});
}
function submitEvidenceForReview(id){
  const p = planById(id);
  if(!hasEvidence(id)){ toast(STATE.lang==='ar'?'يرجى رفع دليل داعم واحد على الأقل':'Please upload at least one supporting evidence file'); return; }
  p.status='Evidence Submitted';
  logAudit(p.respPerson,'Evidence Submitted for Review',id,'Department submitted supporting evidence for Quality verification.');
  toast(STATE.lang==='ar'?'تم تقديم الأدلة للمراجعة':'Evidence submitted for review');
  go('plan-detail',{id});
}
function overrideDueDate(id){
  const p = planById(id);
  const v = document.getElementById('pd-override-date').value;
  if(!v) return;
  p.targetDate = v; p.followUpDate = v; p.manualOverride = true;
  logAudit('Quality Admin','Due Date Manually Overridden',id,`Due date manually set to ${fmtDate(v)} by Quality/Admin authority.`);
  toast(STATE.lang==='ar'?'تم تحديث تاريخ الاستحقاق':'Due date updated');
  go('plan-detail',{id});
}
function clearDueDateOverride(id){
  const p = planById(id); const o = obsById(p.obsId);
  p.manualOverride = false; p.targetDate = planTargetDateStr(p.startDate, o.dept); p.followUpDate = p.targetDate;
  logAudit('Quality Admin','Due Date Reset to Auto-Calculated',id,`Due date reset to the schedule-derived value: ${fmtDate(p.targetDate)}.`);
  toast(STATE.lang==='ar'?'تمت إعادة الحساب التلقائي':'Reset to auto-calculated date');
  go('plan-detail',{id});
}
function submitVerification(id){
  const p = planById(id);
  const result = document.getElementById('qv-result').value;
  const evidenceReviewed = document.getElementById('qv-evreview').checked;
  const effConfirmed = document.getElementById('qv-effconfirm').checked;
  const comments = document.getElementById('qv-comments').value;
  const closureDecision = document.getElementById('qv-closure').value;
  const by = document.getElementById('qv-by').value || currentActorName();
  const date = document.getElementById('qv-date').value || todayStr();

  if(result==='Not Effective' || result==='Requires Further Action'){
    if(!comments.trim()){ toast(STATE.lang==='ar'?'التعليق مطلوب عند اختيار غير فعّالة / تتطلب إجراءً إضافيًا':'A comment is required when the result is Not Effective / Requires Further Action'); return; }
    p.verification = {by, date, result, evidenceReviewed, effectivenessConfirmed:effConfirmed, comments, finalClosureDecision:(STATE.lang==='ar'?'أُعيد فتحها — يتطلب إجراءً إضافيًا':'Reopened — further action required')};
    p.status = 'Implementation in Progress';
    logAudit('Quality Reviewer','Verification — Further Action Required',id,`Verification result: ${result}. Plan automatically reopened and requires further action. Comment: ${comments}`);
    toast(STATE.lang==='ar'?'النتيجة تتطلب إجراءً إضافيًا — أُعيدت الخطة':'Result requires further action — plan reopened');
    go('plan-detail',{id});
    return;
  }

  if(closureDecision==='close'){
    const missing = [];
    if(!hasEvidence(id)) missing.push(STATE.lang==='ar'?'لم يتم رفع الأدلة الداعمة المطلوبة.':'Required supporting evidence has not been uploaded.');
    if(!evidenceReviewed) missing.push(STATE.lang==='ar'?'لم تتم مراجعة الأدلة من قبل الجودة.':'Evidence has not been marked as reviewed by Quality.');
    if(!effConfirmed) missing.push(STATE.lang==='ar'?'لم يتم تأكيد فاعلية الإجراء.':'Effectiveness has not been confirmed.');
    if(missing.length){
      p.verification = {by, date, result, evidenceReviewed, effectivenessConfirmed:effConfirmed, comments};
      p.status = 'Under Verification';
      showCannotCloseModal(missing);
      go('plan-detail',{id});
      return;
    }
    p.verification = {by, date, result, evidenceReviewed, effectivenessConfirmed:effConfirmed, comments, finalClosureDecision:(STATE.lang==='ar'?'مغلقة':'Closed')};
    p.status='Closed'; p.closureDate=todayStr(); p.progress=100;
    logAudit('Quality Reviewer','Finding Closed',id,`Closed after Quality verification — result: ${result}.`);
    toast(STATE.lang==='ar'?'تم إغلاق الملاحظة بعد التحقق':'Finding closed after verification');
  } else {
    p.verification = {by, date, result, evidenceReviewed, effectivenessConfirmed:effConfirmed, comments, finalClosureDecision:(STATE.lang==='ar'?'الإبقاء مفتوحة':'Kept open')};
    p.status='Under Verification';
    logAudit('Quality Reviewer','Verification Recorded',id,`Result: ${result} — kept open pending further steps.`);
    toast(STATE.lang==='ar'?'تم تسجيل التحقق':'Verification recorded');
  }
  go('plan-detail',{id});
}
function showCannotCloseModal(reasons){
  openModal(
    `⚠️ ${STATE.lang==='ar'?'لا يمكن إغلاق الملاحظة':'Cannot Close Finding'}`,
    `<div class="esc-note">${STATE.lang==='ar'?'لم تُستكمل الأدلة أو متطلبات التحقق اللازمة للإغلاق.':'Evidence or verification requirements for closure have not been completed.'}</div>
     <ul style="margin-top:12px;padding-inline-start:18px;font-size:12.5px;line-height:1.9;">${reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`,
    `<button class="btn btn-primary" onclick="closeModal()">${STATE.lang==='ar'?'حسنًا':'OK'}</button>`
  );
}
function openReopenModal(id){
  openModal(
    STATE.lang==='ar'?'إعادة فتح الملاحظة':'Reopen Finding',
    `<div class="field"><label>${STATE.lang==='ar'?'سبب إعادة الفتح (مطلوب)':'Reason for reopening (required)'}</label><textarea id="rp-comment" placeholder="Reason…"></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${STATE.lang==='ar'?'إلغاء':'Cancel'}</button><button class="btn btn-primary" onclick="reopenPlan('${id}')">${STATE.lang==='ar'?'إعادة الفتح':'Reopen'}</button>`
  );
}
function reopenPlan(id){
  const commentEl = document.getElementById('rp-comment');
  const comment = commentEl ? commentEl.value.trim() : '';
  if(!comment){ toast(STATE.lang==='ar'?'السبب مطلوب لإعادة الفتح':'A reason is required to reopen'); return; }
  const p = planById(id); p.status='Implementation in Progress'; p.closureDate=null;
  logAudit('Quality Reviewer','Finding Reopened',id,'Finding reopened for further action. Reason: '+comment);
  closeModal();
  toast(STATE.lang==='ar'?'تم إعادة فتح الملاحظة':'Finding reopened'); go('plan-detail',{id});
}

function filterPlanFollowup(){
  const round = document.getElementById('pf-round').value;
  const dept = document.getElementById('pf-dept').value;
  const domain = document.getElementById('pf-domain').value;
  const risk = document.getElementById('pf-risk').value;
  const status = document.getElementById('pf-status').value;
  const rec = document.getElementById('pf-recurring').value;
  document.querySelectorAll('#pf-table tbody tr').forEach(tr=>{
    const ok = (!round||tr.dataset.round===round) && (!dept||tr.dataset.dept===dept) && (!domain||tr.dataset.domain===domain)
      && (!risk||tr.dataset.risk===risk) && (!status||tr.dataset.status===status) && (!rec||tr.dataset.recurring===rec);
    tr.style.display = ok? '' : 'none';
  });
}

      return `<tr><td class="tbl-link" onclick="go('round-detail',{id:'${r.id}'})">${r.depts.map(deptName).join(' + ')}</td><td>${fmtDate(r.plannedDate)}</td><td>${roundStatusBadge(r)}</td><td>${relatedObs.length}</td><td>${open}</td></tr>`;
    }).join('')}
    </tbody></table></div>
  </div>`;
}
function heatmapTable(){
  return `<table class="heat-table"><thead><tr><th></th>${DOMAINS.map(d=>`<th>${d.sn}</th>`).join('')}</tr></thead><tbody>
  ${DEPARTMENTS.map(dep=>{
    const cells = DOMAINS.map(dom=>{ const v = heatCell(dep.id, dom.id); if(v===null) return `<td></td>`; return `<td class="heat-cell" style="background:${heatColor(v)}">${v}%</td>`; }).join('');
    if(!DOMAINS.some(dom=>heatCell(dep.id,dom.id)!==null)) return '';
    return `<tr><td class="dept-name">${STATE.lang==='ar'?dep.ar:dep.en}</td>${cells}</tr>`;
  }).join('')}
  </tbody></table>`;
}
function trendData(){
  const months = [...new Set(ROUNDS.filter(r=>r.status==='Completed').map(r=>r.plannedDate.slice(0,7)))].sort();
  return months.map(mo=>{
    const rs = ROUNDS.filter(r=>r.status==='Completed' && r.plannedDate.slice(0,7)===mo);
    const vals = rs.map(r=>roundCompliance(r.id));
    const compliance = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    const d0 = parseD(mo+'-01');
    return {label: d0.toLocaleDateString(STATE.lang==='ar'?'ar':'en',{month:'short'}), compliance};
  });
}

   1. Twilio / WhatsApp Configuration

   5. Patient Safety Rounds Members

   7. Manual Message History  (NEW)

   Manual sending is fully independent of the automatic 24h/1h schedule —
   it never touches whatsapp_reminders or the cron queue.
   ================================================================ */
let WA_ADMIN_STATE = {
  loaded:false, rounds:[], templates:[], manualHistory:[], autoHistory:[],
  selectedRoundId:'', attendanceByMember:{}, recipientType:'mobile', manualNumber:'', selectedMemberId:'', selectedMemberIds:[],
  language:'ar', templateName:'patient_safety_round_attendance',
  messageType:'round_notice', customMessage:'',
};
async function renderWhatsAppAdminAsync(){
  const root = document.getElementById('wa-admin-root');
  if(!root) return;
  try{
    const [roundsRes, templatesRes, manualRes, autoRes] = await Promise.all([
      fetch('/api/rounds').then(r=>r.json()).catch(()=>({success:false})),
      fetch('/api/whatsapp?action=templates').then(r=>r.json()).catch(()=>({success:false})),
      fetch('/api/whatsapp?action=manual-send').then(r=>r.json()).catch(()=>({success:false})),
      fetch('/api/whatsapp?action=reminders-log').then(r=>r.json()).catch(()=>({success:false})),
    ]);
    WA_ADMIN_STATE.rounds = roundsRes.success? (roundsRes.rounds||[]).sort((a,b)=>`${b.planned_date||''}T${b.planned_time||'00:00'}`.localeCompare(`${a.planned_date||''}T${a.planned_time||'00:00'}`)) : [];
    WA_ADMIN_STATE.templates = templatesRes.success? templatesRes.templates : [];
    WA_ADMIN_STATE.manualHistory = manualRes.success? manualRes.messages : [];
    WA_ADMIN_STATE.autoHistory = autoRes.success? autoRes.reminders : [];
    if(!WA_ADMIN_STATE.selectedRoundId){
      try{
        const savedRound = localStorage.getItem('psr_selected_attendance_round');
        if(savedRound && WA_ADMIN_STATE.rounds.some(r=>String(r.id)===String(savedRound))) WA_ADMIN_STATE.selectedRoundId = savedRound;
      }catch(e){}
    }
    if(!WA_ADMIN_STATE.selectedRoundId && WA_ADMIN_STATE.rounds.length) WA_ADMIN_STATE.selectedRoundId = WA_ADMIN_STATE.rounds[0].id;

    // Attendance belongs to a specific round, never to the master member roster.
    WA_ADMIN_STATE.attendanceParticipants = [];
    if(WA_ADMIN_STATE.selectedRoundId){
      try{
        const detail = await fetch('/api/rounds?id='+encodeURIComponent(WA_ADMIN_STATE.selectedRoundId)).then(r=>r.json());
        if(detail.success && Array.isArray(detail.participants)){
          WA_ADMIN_STATE.attendanceParticipants = detail.participants.map(p=>{
            const m = p.round_members || {};
            return {
              ...m,
              member_id: p.member_id ?? m.id,
              attendance_status: p.attendance_status || m.attendance_status || 'Pending',
              attendance_responded_at: p.attendance_responded_at || m.attendance_responded_at || null
            };
          }).filter(m=>m.id!==undefined || m.member_id!==undefined);
        }
      }catch(e){ WA_ADMIN_STATE.attendanceParticipants = []; }
    }

    if(!WA_ADMIN_STATE.templates.some(t=>t.name===WA_ADMIN_STATE.templateName) && WA_ADMIN_STATE.templates.length) WA_ADMIN_STATE.templateName = WA_ADMIN_STATE.templates[0].name;
    WA_ADMIN_STATE.loaded = true;
  } catch(error){ /* leave whatever was previously loaded */ }
  root.innerHTML = renderWhatsAppAdminSections();
}

function setManualRecipientType(t){ WA_ADMIN_STATE.recipientType = t; go('admin',{tab:'whatsapp'}); }
function onManualSingleMemberChange(id){
  WA_ADMIN_STATE.selectedMemberId = id;
  const m = ROUND_MEMBERS.find(x=>String(x.id)===String(id));
  if(m && m.preferred_language) WA_ADMIN_STATE.language = m.preferred_language;
  go('admin',{tab:'whatsapp'});
}
function toggleManualMember(id, checked){
  id = String(id);

  if(checked){
    if(!WA_ADMIN_STATE.selectedMemberIds.includes(id)){
      WA_ADMIN_STATE.selectedMemberIds.push(id);
    }
  } else {
    WA_ADMIN_STATE.selectedMemberIds =
      WA_ADMIN_STATE.selectedMemberIds.filter(x => String(x) !== id);
  }

  go('admin',{tab:'whatsapp'});
}

function removeManualMember(id){
  id = String(id);

  WA_ADMIN_STATE.selectedMemberIds =
    WA_ADMIN_STATE.selectedMemberIds.filter(x => String(x) !== id);

  go('admin',{tab:'whatsapp'});
}

function clearManualMembers(){
  WA_ADMIN_STATE.selectedMemberIds = [];
  go('admin',{tab:'whatsapp'});
}
function filterManualHistory(){
  const round = document.getElementById('mh-filter-round').value;
  const status = document.getElementById('mh-filter-status').value;
  const recipient = document.getElementById('mh-filter-recipient').value.trim();
  document.querySelectorAll('#mh-table tbody tr').forEach(tr=>{
    const ok = (!round||tr.dataset.round===round) && (!status||tr.dataset.status===status) && (!recipient||(tr.dataset.recipient||'').includes(recipient));
    tr.style.display = ok? '' : 'none';
  });
}
async function updateTemplateStatus(name, status){
  try{
    const res = await fetch('/api/whatsapp?action=templates&name='+encodeURIComponent(name), { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status, actor: currentActorName()}) });
    const data = await res.json();
    if(!res.ok || !data.success){ toast(data.error||'Failed'); return; }
    const tpl = WA_ADMIN_STATE.templates.find(t=>t.name===name); if(tpl) tpl.status = status;
    toast(STATE.lang==='ar'?'تم تحديث حالة القالب':'Template status updated');
    go('admin',{tab:'whatsapp'});
  } catch(error){ toast(STATE.lang==='ar'?'فشل التحديث':'Update failed'); }
}
function confirmManualSend(delayMs){
  const round = selectedRound();
  if(!round){ toast(STATE.lang==='ar'?'اختاري جولة':'Select a round'); return; }
  const recipients = manualRecipients();
  if(!recipients.length){ toast(STATE.lang==='ar'?'حددي مستلمًا واحدًا على الأقل':'Select at least one recipient'); return; }
  const missingMobile = recipients.filter(r=>!r.mobile);
  if(missingMobile.length){ toast(STATE.lang==='ar'?'يوجد مستلم بدون رقم جوال':'One or more recipients have no mobile number'); return; }
  const names = recipients.map(r=>r.mobile).join('، ');
  openModal(
    STATE.lang==='ar'?'تأكيد الإرسال':'Confirm Send',
    `<p style="font-size:12.8px;">${STATE.lang==='ar'?`هل أنت متأكدة من إرسال إشعار واتساب إلى: ${names} بخصوص الجولة ${round.id}؟`:`Send this WhatsApp notification to: ${names} for round ${round.id}?`}</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${STATE.lang==='ar'?'إلغاء':'Cancel'}</button><button class="btn btn-primary" onclick="closeModal(); executeManualSend(${delayMs})">${STATE.lang==='ar'?'تأكيد الإرسال':'Confirm Send'}</button>`
  );
}
async function executeManualSend(delayMs){
  const resultEl = document.getElementById('ms-result');
  const round = selectedRound();
  const recipients = manualRecipients();
  const templateName = WA_ADMIN_STATE.templateName;
  const language = WA_ADMIN_STATE.language;
  if(resultEl) resultEl.innerHTML = `<div class="info-banner" style="margin-top:12px;">${delayMs>0? (STATE.lang==='ar'?`سيتم الإرسال خلال ${Math.round(delayMs/60000)} دقيقة — أبقي الصفحة مفتوحة...`:`Sending in ${Math.round(delayMs/60000)} minute(s) — keep this page open…`) : (STATE.lang==='ar'?'جارٍ الإرسال...':'Sending…')}</div>`;

  const doSend = async () => {
    try{
      const res = await fetch('/api/whatsapp?action=manual-send', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          round_id: round.id,
          recipients,
          language,
          template_name: templateName,
          message_type: WA_ADMIN_STATE.messageType,
          custom_message: WA_ADMIN_STATE.customMessage,
          sent_by: currentActorName()
        })
      });
      const data = await res.json();
      const rows = data.results || [];
      const html = rows.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12px;">
        <b>${esc(r.recipient_mobile)}</b> — <span class="badge ${r.status==='sent'?'b-green':'b-red'}">${r.status==='sent'?(STATE.lang==='ar'?'أُرسلت':'Sent'):(STATE.lang==='ar'?'فشلت':'Failed')}</span>
        ${r.message_sid? ` · SID: ${esc(r.message_sid)}`:''}${r.failure_reason? ` · ${esc(r.failure_reason)}`:''}
      </div>`).join('');
      if(resultEl) resultEl.innerHTML = `<div class="card" style="margin-top:12px;"><div class="card-pad">${html || `<div class="empty">${esc(data.error||'No result')}</div>`}</div></div>`;
      if(!res.ok && data.error){ toast(data.error); }
      await renderWhatsAppAdminAsync();
    } catch(error){
      if(resultEl) resultEl.innerHTML = `<div class="esc-note" style="margin-top:12px;">${STATE.lang==='ar'?'تعذّر الإرسال':'Send failed'}: ${esc(error.message)}</div>`;
    }
  };

  if(delayMs>0){ setTimeout(doSend, delayMs); } else { await doSend(); }
}

/* ---------------- Path-based routing for secure public links ---------------- */
function isPublicRoundPath(){ return location.pathname.startsWith('/round/'); }
function isPublicPlanPath(){ return location.pathname.startsWith('/plan/'); }
function publicToken(){ return location.pathname.split('/').filter(Boolean)[1] || ''; }
function hidePublicChrome(){
  const sb = document.getElementById('sidebar'); if(sb) sb.style.display='none';
  const tb = document.getElementById('topbar'); if(tb) tb.style.display='none';
  document.getElementById('main').style.width='100%';
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{ const r = new FileReader(); r.onload=()=>resolve(r.result.split(',')[1]); r.onerror=reject; r.readAsDataURL(file); });
}

async function uploadPublicPlan(){
  const f = document.getElementById('pp-plan-file').files[0];
  if(!f){ toast(STATE.lang==='ar'?'اختر ملفًا':'Choose a file'); return; }
  const name = 'Department';
  const b64 = await fileToBase64(f);
  const res = await fetch('/api/public-plan', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token:publicToken(), action:'upload_plan', uploaded_by:name, file_name:f.name, file_type:f.type, file_base64:b64})});

  if(!res.ok || !data.success){ toast(data.error||'Upload failed'); return; }
  Object.assign(PUBLIC_PLAN_STATE.plan, data.plan);

}

async function submitPublicPlan(){
